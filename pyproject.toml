[project]
name = "shopid"
version = "0.1.0"
dependencies = [
    "Flask>=3.0.0",
    "pymongo>=4.6.0",
    "dnspython>=2.0.0",
    "python-dotenv>=1.0.0",
    "Flask-WTF>=1.2.1",
    "Flask-Limiter>=3.5.0",
    "argon2-cffi>=23.1.0",
    "Pillow>=10.0.0",
    "gunicorn>=21.2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.vercel]
entrypoint = "run:app"
